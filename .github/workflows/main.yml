name: Build TGram APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject Keys and Build
        run: |
          # Эта магия вставляет твои секреты прямо в код перед сборкой
          sed -i "s/APP_ID = 0/APP_ID = ${{ secrets.TELEGRAM_API_ID }}/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_HASH = \"\"/APP_HASH = \"${{ secrets.TELEGRAM_API_HASH }}\"/g" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TGram-Release
          path: TMessagesProj/build/outputs/apk/debug/*.apk
